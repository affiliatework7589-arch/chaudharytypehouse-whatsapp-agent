services:
  - type: worker
    name: chaudhary-whatsapp-bridge
    env: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PYTHON
        value: python3
    disk:
      name: wa-session
      mountPath: /opt/render/project/src/auth_info_baileys
      sizeGB: 1
"