services:
  - type: worker
    name: chaudhary-whatsapp-bridge
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    envVars:
      - key: PYTHON
        value: python3
      - key: WA_AUTH_DIR
        value: /app/auth_info_baileys
      - key: PYTHONIOENCODING
        value: utf-8
    disk:
      name: wa-session
      mountPath: /app/auth_info_baileys
      sizeGB: 1
