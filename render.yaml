services:
  - type: web
    name: chaudhary-whatsapp-bridge
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: PYTHON
        value: python3
      - key: WA_AUTH_DIR
        value: /app/auth_info_baileys
      - key: PYTHONIOENCODING
        value: utf-8
      - key: LOG_LEVEL
        value: info
      - key: TYPING_MIN_MS
        value: "5000"
      - key: TYPING_MAX_MS
        value: "10000"
      - key: OFFLINE_REPLY_WINDOW_MIN
        value: "60"
      - key: STALE_MS
        value: "1200000"
      # NOTE: a persistent disk can be attached later from the Render dashboard
      # (Disks tab -> Mount Path: /app/auth_info_baileys). Disks require a paid plan.
      # On the free tier the session survives instance sleep, but NOT a new deploy.
